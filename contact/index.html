<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoshFeel | Contact</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div id="particles"></div>

    <header class="main-header">
        <div class="logo">
            <h1>RoshFeel</h1>
        </div>
        <nav class="navbar">
            <a href="/" class="nav-link">Home</a>
            <a href="/blog/" class="nav-link">Blog</a>
            <a href="/contact/" class="nav-link active">Contact</a>
            <a href="https://redchy.com" class="shop-btn" target="_blank" rel="noopener">REDCHY</a>
        </nav>
    </header>

    <main class="container contact-container">
        <div class="contact-layout">

            <!-- Columna izquierda: contactos -->
            <section class="hero contact-col">
                <h2>Contacts</h2>
                <ul class="contact-list">
                    <li>
                        <a href="https://youtube.com/@roshfeel" target="_blank" rel="noopener">
                            <i class="fab fa-youtube"></i><span>YouTube</span>
                        </a>
                    </li>
                    <li>
                        <a href="https://tiktok.com/@roshfeel" target="_blank" rel="noopener">
                            <i class="fab fa-tiktok"></i><span>TikTok</span>
                        </a>
                    </li>
                    <li>
                        <a href="https://instagram.com/rosh_feel/" target="_blank" rel="noopener">
                            <i class="fab fa-instagram"></i><span>Instagram</span>
                        </a>
                    </li>
                    <li>
                        <a href="https://www.roblox.com/es/users/3763343/profile" target="_blank" rel="noopener">
                            <i class="fas fa-gamepad"></i><span>Roblox</span>
                        </a>
                    </li>
                    <li>
                        <a href="https://x.com/roshfeel" target="_blank" rel="noopener">
                            <i class="fab fa-x-twitter"></i><span>X (Twitter)</span>
                        </a>
                    </li>
                </ul>
            </section>

            <!-- Columna derecha: formulario -->
            <section class="hero contact-col">
                <h2>MSG</h2>
                <p>Get in touch with me</p>

                <form action="https://formspree.io/f/myeyvqbe" method="POST" class="roshfeel-form">
                    <div class="form-group">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required placeholder="Name/internet identity">
                    </div>

                    <div class="form-group">
                        <label for="email">Mail:</label>
                        <input type="email" id="email" name="email" required placeholder="mail@example.com">
                    </div>

                    <div class="form-group">
                        <label for="message">Message:</label>
                        <textarea id="message" name="message" rows="5" required placeholder="your desire..."></textarea>
                    </div>

                    <button type="submit" class="submit-btn">Submit</button>
                </form>
            </section>

        </div>
    </main>

    <script>
        const particlesContainer = document.getElementById('particles');
        const particleCount = 25;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            particle.style.left = `${Math.random() * 100}vw`;
            particle.style.top = `${Math.random() * 100}vh`;
            particle.style.animationDuration = `${Math.random() * 5 + 3}s`;
            particle.style.animationDelay = `${Math.random() * 2}s`;
            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>
