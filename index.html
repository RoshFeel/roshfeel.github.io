<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoshFeel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Fondo de partículas dinámicas -->
    <div id="particles"></div>

    <header class="main-header">
        <div class="logo">
            <h1>RoshFeel</h1>
        </div>
        <nav class="navbar">
            <a href="/" class="nav-link active">Home</a>
            <a href="/contact/" class="nav-link">Contact</a>
            <a href="https://redchy.com" class="shop-btn" target="_blank" rel="noopener">REDCHY</a>
        </nav>
    </header>

    <main class="container">
        
        <section class="hero">
            <div class="status-bar">
                <span class="status-dot"></span>
                <span class="status-text">RED SUPREMACY</span>
            </div>
            <h2>RoshFeel</h2>
            <p>Currently working on RedChy.</p>
        </section>

        <!-- Redes / Hub Principal -->
        <section class="hub-grid">
            <a href="https://youtube.com/@roshfeel" class="hub-card" target="_blank" rel="noopener">
                <i class="fab fa-youtube"></i> YouTube
            </a>
            <a href="https://tiktok.com/@roshfeel" class="hub-card" target="_blank" rel="noopener">
                <i class="fab fa-tiktok"></i> TikTok
            </a>
            <a href="https://instagram.com/rosh_feel/" class="hub-card" target="_blank" rel="noopener">
                <i class="fab fa-instagram"></i> Instagram
            </a>
            <a href="https://www.roblox.com/es/users/3763343/profile" class="hub-card" target="_blank" rel="noopener">
                <i class="fas fa-gamepad"></i> Roblox
            </a>
            <a href="https://x.com/roshfeel" class="hub-card" target="_blank" rel="noopener">
                <i class="fab fa-x-twitter"></i> X (Twitter)
            </a>
        </section>

    </main>

    <script>
        // Generador dinámico de partículas rojas en el fondo
        const particlesContainer = document.getElementById('particles');
        const particleCount = 25;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            particle.style.left = `${Math.random() * 100}vw`;
            particle.style.top = `${Math.random() * 100}vh`;
            particle.style.animationDuration = `${Math.random() * 5 + 3}s`;
            particle.style.animationDelay = `${Math.random() * 2}s`;
            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>
