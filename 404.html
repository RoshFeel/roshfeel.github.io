<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>RoshFeel | 404</title>
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div id="particles"></div>

    <header class="main-header">
        <div class="logo">
            <h1>RoshFeel</h1>
        </div>
        <nav class="navbar">
            <a href="/" class="nav-link">Home</a>
            <a href="/videos/" class="nav-link">Videos</a>
            <a href="/contact/" class="nav-link">Contact</a>
            <a href="https://redchy.com" class="shop-btn" target="_blank" rel="noopener">REDCHY</a>
        </nav>
    </header>

    <main class="container">
        <section class="hero error-hero">
            <h1 class="error-code">404</h1>
            <h2>Vaya, te has perdido en el sistema</h2>
            <p class="error-text">La página que buscas no existe o se movió a otra ruta. Elige a dónde quieres ir:</p>

            <div class="hub-grid">
                <a href="/" class="hub-card">
                    <i class="fas fa-house"></i> Home
                </a>
                <a href="/videos/" class="hub-card">
                    <i class="fas fa-circle-play"></i> Videos
                </a>
                <a href="/contact/" class="hub-card">
                    <i class="fas fa-envelope"></i> Contact
                </a>
                <a href="https://redchy.com" class="hub-card" target="_blank" rel="noopener">
                    <i class="fas fa-cube"></i> RedChy
                </a>
            </div>
        </section>
    </main>

    <script>
        const particlesContainer = document.getElementById('particles');
        const particleCount = 25;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            particle.style.left = `${Math.random() * 100}vw`;
            particle.style.top = `${Math.random() * 100}vh`;
            particle.style.animationDuration = `${Math.random() * 5 + 3}s`;
            particle.style.animationDelay = `${Math.random() * 2}s`;
            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>
