<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Roshfeel</title>
    <!-- Enlazamos tu CSS principal (subiendo un nivel con ../) -->
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <header>
        <!-- Aquí puedes poner el mismo menú de navegación que tienes en tu index principal -->
        <nav>
            <a href="/">← Volver al inicio</a>
        </nav>
    </header>

    <main class="contact-container">
        <h1>Ponte en contacto</h1>
        <p>¿Tienes alguna idea o proyecto en mente? Escríbeme y hablemos.</p>

        <!-- Formulario de Formspree -->
        <form action="https://formspree.io/f/myeyvqbe" method="POST" class="roshfeel-form">
            
            <div class="form-group">
                <label for="name">Nombre:</label>
                <input type="text" id="name" name="name" required placeholder="Tu nombre o nickname">
            </div>

            <div class="form-group">
                <label for="email">Mail:</label>
                <input type="email" id="email" name="email" required placeholder="tu@correo.com">
            </div>

            <div class="form-group">
                <label for="message">Mensaje:</label>
                <textarea id="message" name="message" rows="5" required placeholder="Que me quieres decir..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Enviar</button>
        </form>
    </main>

</body>
</html>
