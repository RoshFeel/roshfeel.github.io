<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoshFeel | Blog</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div id="particles"></div>

    <header class="main-header">
        <div class="logo">
            <h1>RoshFeel Blog</h1>
        </div>
        <nav class="navbar">
            <a href="/" class="nav-link">Home</a>
            <a href="/blog/" class="nav-link active">Blog</a>
            <a href="/contact/" class="nav-link">Contact</a>
            <a href="https://redchy.com" class="shop-btn" target="_blank" rel="noopener">REDCHY</a>
        </nav>
    </header>

    <main class="container">
        <section class="hero">
            <h2>Media Stream</h2>
            <p>Registros, videos y actualizaciones oficiales.</p>
        </section>

        <!-- Contenedor donde se muestran tus publicaciones oficiales -->
        <section class="blog-grid" id="blog-posts-container">
            <!-- Publicación de ejemplo con video de Google Drive -->
            <div class="blog-card">
                <!-- Para mostrar un video de Google Drive, puedes usar un iframe o un enlace directo -->
                <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; background: #000;">
                    <iframe src="https://www.youtube.com/embed/qzKzVr_hDgU" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border:0;" allowfullscreen></iframe>
                </div>
                <div class="blog-content">
                    <span class="blog-date"><i class="far fa-calendar-alt"></i> 28/08/2026</span>
                    <h3>Como jugar con gente en mi servidor RedChy</h3>
                    <p>
    Entra y forma tu clan, El discord de mi servidor de MC es este: 
    <a href="https://discord.redchy.com" target="_blank" rel="noopener" style="color: var(--primary-red); text-decoration: underline;">Discord</a>
</p>
                </div>
            </div>

            <!-- Puedes duplicar la estructura anterior si deseas añadir más videos o imágenes en el futuro -->
        </section>
    </main>

    <script>
        // Fondo de partículas estético
        const particlesContainer = document.getElementById('particles');
        const particleCount = 25;
        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            particle.style.left = `${Math.random() * 100}vw`;
            particle.style.top = `${Math.random() * 100}vh`;
            particle.style.animationDuration = `${Math.random() * 5 + 3}s`;
            particle.style.animationDelay = `${Math.random() * 2}s`;
            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>
